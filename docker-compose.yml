services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: amend_owner
      POSTGRES_PASSWORD: ${AMEND_OWNER_PASSWORD}
      POSTGRES_DB: amend
      AMEND_APP_PASSWORD: ${AMEND_APP_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/02-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amend_owner -d amend"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "${MAILPIT_UI_PORT}:8025"
      - "${MAILPIT_SMTP_PORT}:1025"

volumes:
  postgres_data:
